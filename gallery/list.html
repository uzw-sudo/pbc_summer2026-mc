<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>真夜中珈琲屋台｜カード一覧</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;
    }


    body {

      color: #ead8b3;

      font-family:
        "Noto Serif JP",
        "Yu Mincho",
        serif;

      background:

        radial-gradient(
          circle at 15% 20%,
          rgba(255,255,255,.10) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 72% 14%,
          rgba(255,255,255,.08) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 88% 65%,
          rgba(255,255,255,.08) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 42% 84%,
          rgba(255,255,255,.06) 0 1px,
          transparent 1.5px
        ),

        linear-gradient(
          180deg,
          #07111f 0%,
          #050912 100%
        );

      background-size:
        170px 170px,
        240px 240px,
        310px 310px,
        220px 220px,
        auto;

    }



    /* ========================================
       PAGE
    ======================================== */

    .page {

      width:
        min(
          1240px,
          96%
        );

      margin: 0 auto;

      padding:
        20px
        0
        30px;

    }



    /* ========================================
       HEADER
    ======================================== */

    .header {

      text-align: center;

      margin-bottom: 11px;

    }


    .header h1 {

      margin: 0;

      color: #efd8aa;

      font-size:
        clamp(
          21px,
          2.4vw,
          31px
        );

      font-weight: 400;

      letter-spacing: .08em;

      line-height: 1.3;

    }


    .header p {

      margin:
        4px
        0
        0;

      color:
        rgba(
          234,
          216,
          179,
          .58
        );

      font-size: 10px;

    }



    /* ========================================
       CATEGORY BUTTONS
    ======================================== */

    .categories {

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 8px;

      margin-bottom: 12px;

      flex-wrap: wrap;

    }


    .category-button {

      padding:
        6px
        15px;

      border:
        1px solid
        rgba(
          167,
          125,
          60,
          .72
        );

      border-radius: 999px;

      background:
        rgba(
          7,
          13,
          23,
          .82
        );

      color: #ead8b3;

      font-family: inherit;

      font-size: 10px;

      cursor: pointer;

      transition:
        .18s ease;

    }


    .category-button:hover {

      background:
        rgba(
          167,
          125,
          60,
          .13
        );

    }


    .category-button.active {

      border-color: #bd8c43;

      background:
        rgba(
          167,
          125,
          60,
          .20
        );

      box-shadow:
        0 0 15px
        rgba(
          167,
          125,
          60,
          .08
        );

    }



    /* ========================================
       SECTION TITLE
    ======================================== */

    .section-title {

      text-align: center;

      margin-bottom: 11px;

      line-height: 1.25;

    }


    .section-title .en {

      display: block;

      margin-bottom: 2px;

      color:
        rgba(
          234,
          216,
          179,
          .54
        );

      font-size: 9px;

      letter-spacing: .20em;

    }


    .section-title .jp {

      color: #efd5a0;

      font-size: 17px;

      letter-spacing: .08em;

    }


    .section-title .count {

      margin-left: 7px;

      color:
        rgba(
          234,
          216,
          179,
          .53
        );

      font-size: 9px;

    }



    /* ========================================
       GRID
    ======================================== */

    .card-grid {

      display: grid;

      grid-template-columns:
        repeat(
          6,
          minmax(0, 1fr)
        );

      gap: 8px;

    }



    /* ========================================
       CARD
    ======================================== */

    .card-link {

      position: relative;

      display: block;

      min-width: 0;
      min-height: 76px;

      padding:
        10px
        12px;

      overflow: hidden;

      border:
        1px solid
        rgba(
          177,
          136,
          69,
          .48
        );

      border-radius: 9px;

      background:

        linear-gradient(
          135deg,
          rgba(255,255,255,.035),
          transparent 45%
        ),

        linear-gradient(
          180deg,
          rgba(22,32,46,.94),
          rgba(7,13,23,.96)
        );

      color: #ead8b3;

      text-decoration: none;

      transition:
        transform .16s ease,
        border-color .16s ease,
        background .16s ease,
        box-shadow .16s ease;

    }


    .card-link:hover {

      transform:
        translateY(-2px);

      border-color:
        rgba(
          211,
          168,
          95,
          .95
        );

      box-shadow:
        0 8px 20px
        rgba(0,0,0,.24);

    }


    .card-id {

      display: block;

      margin-bottom: 5px;

      color: #bd9150;

      font-size: 8px;

      letter-spacing: .15em;

    }


    .card-name {

      display: block;

      padding-right: 18px;

      color: #f0dbb2;

      font-size:
        clamp(
          11px,
          1.1vw,
          14px
        );

      line-height: 1.35;

      overflow-wrap: anywhere;

    }


    .card-arrow {

      position: absolute;

      right: 9px;
      bottom: 7px;

      color:
        rgba(
          205,
          164,
          97,
          .72
        );

      font-size: 8px;

    }



    /* ========================================
       SPECIAL COLORS
    ======================================== */

    .card-link.fullmoon {

      border-color:
        rgba(
          218,
          179,
          91,
          .75
        );

      background:

        radial-gradient(
          circle at 90% 10%,
          rgba(230,190,90,.15),
          transparent 45%
        ),

        linear-gradient(
          180deg,
          rgba(34,31,25,.96),
          rgba(11,13,20,.98)
        );

    }


    .card-link.fullmoon .card-name {

      color: #f3d789;

    }


    .card-link.secret {

      border-color:
        rgba(
          157,
          125,
          183,
          .70
        );

      background:

        radial-gradient(
          circle at 90% 10%,
          rgba(144,102,170,.16),
          transparent 45%
        ),

        linear-gradient(
          180deg,
          rgba(28,28,48,.95),
          rgba(8,12,24,.98)
        );

    }


    .card-link.secret .card-name {

      color: #dcc8ec;

    }


    .card-link.rare {

      border-color:
        rgba(
          196,
          155,
          86,
          .66
        );

      background:

        radial-gradient(
          circle at 90% 10%,
          rgba(196,155,86,.10),
          transparent 45%
        ),

        linear-gradient(
          180deg,
          rgba(25,32,43,.95),
          rgba(7,13,23,.98)
        );

    }



    /* ========================================
       CAT ENDING
    ======================================== */

    .cat-ending {

      margin-top: 28px;

      padding:
        18px
        14px
        7px;

      text-align: center;

    }


    .cat-stage {

      position: relative;

      width:
        min(
          540px,
          94%
        );

      margin:
        0 auto
        8px;

      overflow: hidden;

    }


    /*
      猫＋鳥＋足跡は
      1枚の画像になっています。
    */

    .cat-walker {

      width: 100%;

      display: flex;

      justify-content: center;
      align-items: flex-end;

      opacity: 0;

      transform:
        translateX(120px);

      animation:
        catWalkIn
        2.7s
        cubic-bezier(.20,.70,.25,1)
        forwards;

    }


    .cat-image {

      display: block;

      width:
        min(
          100%,
          500px
        );

      height: auto;

      user-select: none;
      pointer-events: none;

      filter:
        drop-shadow(
          0
          8px
          18px
          rgba(0,0,0,.28)
        );

    }



    /* ========================================
       CAT MESSAGE
    ======================================== */

    .cat-message {

      margin-top: 2px;

      line-height: 1.6;

      opacity: 0;

      transform:
        translateY(6px);

      animation:
        catMessageIn
        1.3s
        ease
        1.9s
        forwards;

    }


    .cat-main {

      display: block;

      color: #f0d9ab;

      font-size:
        clamp(
          17px,
          1.8vw,
          21px
        );

      letter-spacing: .12em;

    }


    .cat-sub {

      display: block;

      margin-top: 3px;

      color:
        rgba(
          234,
          216,
          179,
          .60
        );

      font-size:
        clamp(
          10px,
          1vw,
          12px
        );

      letter-spacing: .10em;

    }



    /* ========================================
       ANIMATION
    ======================================== */

    @keyframes catWalkIn {

      0% {

        opacity: 0;

        transform:
          translateX(130px);

      }

      20% {

        opacity: 1;

      }

      100% {

        opacity: 1;

        transform:
          translateX(0);

      }

    }


    @keyframes catMessageIn {

      0% {

        opacity: 0;

        transform:
          translateY(6px);

      }

      100% {

        opacity: 1;

        transform:
          translateY(0);

      }

    }



    /* ========================================
       FOOTER
    ======================================== */

    .footer-actions {

      display: flex;

      justify-content: center;

      margin-top: 11px;

    }


    .back-button {

      display: inline-block;

      min-width: 180px;

      padding:
        7px
        20px;

      border:
        1px solid
        #a77d3c;

      border-radius: 999px;

      background:
        rgba(
          7,
          13,
          23,
          .88
        );

      color: #ead8b3;

      font-size: 10px;

      text-align: center;

      text-decoration: none;

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;

    }


    .back-button:hover {

      background:
        rgba(
          167,
          125,
          60,
          .16
        );

      border-color:
        #c99b52;

      transform:
        translateY(-1px);

    }



    /* ========================================
       COMPACT PC
    ======================================== */

    @media
    (max-height: 800px)
    and
    (min-width: 801px) {

      .page {

        padding:
          11px
          0
          18px;

      }


      .header {

        margin-bottom: 6px;

      }


      .header h1 {

        font-size: 22px;

      }


      .categories {

        margin-bottom: 7px;

      }


      .category-button {

        padding:
          4px
          12px;

      }


      .section-title {

        margin-bottom: 7px;

      }


      .card-grid {

        gap: 6px;

      }


      .card-link {

        min-height: 66px;

        padding:
          8px
          10px;

      }


      .card-name {

        font-size: 11px;

      }


      .cat-ending {

        margin-top: 20px;

        padding-top: 12px;

      }


      .cat-image {

        width:
          min(
            100%,
            420px
          );

      }


      .footer-actions {

        margin-top: 8px;

      }

    }



    /* ========================================
       TABLET
    ======================================== */

    @media
    (max-width: 1000px) {

      .card-grid {

        grid-template-columns:
          repeat(
            5,
            minmax(0, 1fr)
          );

      }

    }



    /* ========================================
       MOBILE
    ======================================== */

    @media
    (max-width: 650px) {

      .page {

        width: 94%;

      }


      .header h1 {

        font-size: 18px;

      }


      .card-grid {

        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

        gap: 7px;

      }


      .card-link {

        min-height: 76px;

      }


      .cat-ending {

        margin-top: 22px;

        padding:
          14px
          4px
          6px;

      }


      .cat-stage {

        width: 100%;

      }


      .cat-image {

        width:
          min(
            100%,
            390px
          );

      }


      .cat-main {

        font-size: 17px;

      }


      .cat-sub {

        font-size: 10px;

      }

    }



    /* ========================================
       REDUCED MOTION
    ======================================== */

    @media
    (prefers-reduced-motion: reduce) {

      .cat-walker,
      .cat-message {

        animation:
          none !important;

        opacity:
          1 !important;

        transform:
          none !important;

      }

    }

  </style>

</head>



<body>


<main class="page">


  <!-- ======================================
       HEADER
  ======================================= -->

  <header class="header">

    <h1>
      真夜中珈琲屋台　カードギャラリー
    </h1>

    <p>
      2026 夏祭り　営業記録
    </p>

  </header>



  <!-- ======================================
       CATEGORY
  ======================================= -->

  <nav
    class="categories"
    aria-label="カードの種類"
  >

    <button
      class="category-button active"
      data-category="coffee"
      type="button"
    >
      ☕ 珈琲カード
    </button>


    <button
      class="category-button"
      data-category="takeout"
      type="button"
    >
      🥤 テイクアウト
    </button>


    <button
      class="category-button"
      data-category="sparkler"
      type="button"
    >
      🎇 線香花火
    </button>

  </nav>



  <!-- ======================================
       SECTION TITLE
  ======================================= -->

  <div class="section-title">

    <span
      class="en"
      id="sectionEn"
    >
      COFFEE COLLECTION
    </span>

    <span
      class="jp"
      id="sectionJp"
    >
      珈琲カード
    </span>

    <span
      class="count"
      id="sectionCount"
    >
      全30種
    </span>

  </div>



  <!-- ======================================
       CARD GRID
  ======================================= -->

  <div
    class="card-grid"
    id="cardGrid"
  >
  </div>



  <!-- ======================================
       CAT ENDING
  ======================================= -->

  <section
    class="cat-ending"
    aria-label="猫からのひとこと"
  >

    <div class="cat-stage">

      <div class="cat-walker">

        <img
          class="cat-image"
          src="../assets/images/cat-ending.png"
          alt="歩く黒猫と、そのそばを飛ぶ小さな鳥"
        >

      </div>

    </div>


    <div class="cat-message">

      <span class="cat-main">
        またにゃ。
      </span>

      <span class="cat-sub">
        またどこかの夜で。
      </span>

    </div>

  </section>



  <!-- ======================================
       FOOTER
  ======================================= -->

  <div class="footer-actions">

    <a
      class="back-button"
      href="../index.html"
    >
      ☕ 屋台に戻る
    </a>

  </div>


</main>



<script>

  "use strict";


  /* ==========================================================
     DATA
  ========================================================== */

  const collections = {


    /* --------------------------------------------------------
       COFFEE
    -------------------------------------------------------- */

    coffee: {

      en:
        "COFFEE COLLECTION",

      jp:
        "珈琲カード",

      cards: [

        ["M-001", "月灯りブレンド"],
        ["M-002", "三日月カフェオレ"],
        ["M-003", "雨宿り珈琲"],
        ["M-004", "夜風アイス珈琲"],
        ["M-005", "午前二時の深煎り"],

        ["M-006", "焦がし蜂蜜ラテ"],
        ["M-007", "霧夜ラテ"],
        ["M-008", "黒糖きなこ珈琲"],
        ["M-009", "星屑フラッペ"],
        ["M-010", "塩キャラメルラテ"],

        ["M-011", "柚子香る夜珈琲"],
        ["M-012", "山椒モカ"],
        ["M-013", "月影コールドブリュー"],
        ["M-014", "眠れない夜のデカフェ"],
        ["M-015", "雷鳴エスプレッソ"],

        ["M-016", "宵待ちカプチーノ"],
        ["M-017", "琥珀糖ラテ"],
        ["M-018", "夜汽車ブレンド"],
        ["M-019", "銀河ミルク珈琲"],
        ["M-020", "薄明ショコラモカ"],

        ["M-021", "木漏れ月ブレンド"],
        ["M-022", "灯火シナモンラテ"],
        ["M-023", "夜桜ラテ"],
        ["M-024", "流星珈琲"],
        ["M-025", "新月ブラック"],

        ["M-026", "宵星アフォガート"],
        ["M-027", "月蝕モカ"],
        ["M-028", "午前零時の一杯"],
        ["M-029", "FULL MOON"],
        ["M-030", "店主の気まぐれ"]

      ]

    },



    /* --------------------------------------------------------
       TAKEOUT
    -------------------------------------------------------- */

    takeout: {

      en:
        "TAKEOUT COLLECTION",

      jp:
        "テイクアウトカード",

      cards: [

        ["T-001", "焦がし蜂蜜ラテ"],
        ["T-002", "黒糖ミルク珈琲"],
        ["T-003", "夜風のアイス珈琲"],
        ["T-004", "星屑ショコラ"],
        ["T-005", "月夜のカフェオレ"],
        ["T-006", "真夜中のデカフェ"],
        ["T-007", "猫印の気まぐれ珈琲"]

      ]

    },



    /* --------------------------------------------------------
       SPARKLER
    -------------------------------------------------------- */

    sparkler: {

      en:
        "SPARKLER COLLECTION",

      jp:
        "線香花火カード",

      cards: [

        ["S-001", "牡丹"],
        ["S-002", "松葉"],
        ["S-003", "散り菊"],
        ["S-004", "月雫"],
        ["S-005", "星結び"],
        ["S-006", "願い星"],
        ["S-007", "帰り灯"],
        ["S-008", "夜凪"]

      ]

    }

  };



  /* ==========================================================
     ELEMENTS
  ========================================================== */

  const grid =
    document.getElementById(
      "cardGrid"
    );


  const sectionEn =
    document.getElementById(
      "sectionEn"
    );


  const sectionJp =
    document.getElementById(
      "sectionJp"
    );


  const sectionCount =
    document.getElementById(
      "sectionCount"
    );


  const categoryButtons =
    document.querySelectorAll(
      ".category-button"
    );



  /* ==========================================================
     SPECIAL STYLE
  ========================================================== */

  function applySpecialStyle(
    link,
    category,
    id
  ) {


    /* FULL MOON */

    if (
      category === "coffee"
      &&
      id === "M-029"
    ) {

      link.classList.add(
        "fullmoon"
      );

    }


    /* COFFEE SECRET */

    if (
      category === "coffee"
      &&
      id === "M-030"
    ) {

      link.classList.add(
        "secret"
      );

    }


    /* TAKEOUT RARE */

    if (
      category === "takeout"
      &&
      id === "T-007"
    ) {

      link.classList.add(
        "rare"
      );

    }


    /* SPARKLER RARE */

    if (
      category === "sparkler"
      &&
      (
        id === "S-004"
        ||
        id === "S-005"
      )
    ) {

      link.classList.add(
        "rare"
      );

    }


    /* SPARKLER SECRET */

    if (
      category === "sparkler"
      &&
      id === "S-006"
    ) {

      link.classList.add(
        "secret"
      );

    }

  }



  /* ==========================================================
     CARD URL
  ========================================================== */

  function makeCardURL(
    category,
    id
  ) {

    if (
      category === "coffee"
    ) {

      return (
        `./index.html?card=${encodeURIComponent(id)}`
      );

    }


    if (
      category === "takeout"
    ) {

      return (
        `./viewer.html?type=takeout&card=${encodeURIComponent(id)}`
      );

    }


    return (
      `./viewer.html?type=sparkler&card=${encodeURIComponent(id)}`
    );

  }



  /* ==========================================================
     RENDER COLLECTION
  ========================================================== */

  function renderCollection(
    category
  ) {

    const collection =
      collections[category];


    if (!collection) {
      return;
    }


    /* 見出し */

    sectionEn.textContent =
      collection.en;


    sectionJp.textContent =
      collection.jp;


    sectionCount.textContent =
      `全${collection.cards.length}種`;


    /* タブ */

    categoryButtons.forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.category === category
        );

      }
    );


    /* 一覧 */

    grid.innerHTML =
      "";


    collection.cards.forEach(
      ([id, name]) => {

        const link =
          document.createElement(
            "a"
          );


        link.className =
          "card-link";


        link.href =
          makeCardURL(
            category,
            id
          );


        applySpecialStyle(
          link,
          category,
          id
        );


        link.innerHTML = `

          <span class="card-id">
            ${id}
          </span>

          <span class="card-name">
            ${name}
          </span>

          <span class="card-arrow">
            VIEW →
          </span>

        `;


        grid.appendChild(
          link
        );

      }
    );

  }



  /* ==========================================================
     CATEGORY SWITCH
  ========================================================== */

  categoryButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          renderCollection(
            button.dataset.category
          );

        }
      );

    }
  );



  /* ==========================================================
     START
  ========================================================== */

  renderCollection(
    "coffee"
  );

</script>


</body>

</html>
