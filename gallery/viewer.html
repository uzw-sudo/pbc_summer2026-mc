<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    真夜中珈琲屋台｜カードギャラリー
  </title>


  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ========================================
       RESET
    ======================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      overflow: hidden;

    }


    body {

      color: #ead8b3;

      font-family:
        "Noto Serif JP",
        "Yu Mincho",
        serif;


      background:

        radial-gradient(
          circle at 15% 20%,
          rgba(255,255,255,.11) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 72% 14%,
          rgba(255,255,255,.08) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 88% 65%,
          rgba(255,255,255,.08) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 42% 84%,
          rgba(255,255,255,.06) 0 1px,
          transparent 1.5px
        ),

        linear-gradient(
          180deg,
          #07111f 0%,
          #050912 100%
        );


      background-size:

        170px 170px,
        240px 240px,
        310px 310px,
        220px 220px,
        auto;

    }



    /* ========================================
       PAGE
    ======================================== */

    .gallery {

      width: 100%;
      height: 100vh;

      display: grid;

      grid-template-rows:
        auto
        auto
        minmax(0, 1fr)
        auto;

      gap: 9px;

      padding:
        18px
        18px
        14px;

    }



    /* ========================================
       HEADER
    ======================================== */

    .gallery-header {

      text-align: center;

      line-height: 1.3;

    }


    .gallery-title {

      margin: 0;

      color: #efd8aa;

      font-size:
        clamp(
          19px,
          2vw,
          27px
        );

      font-weight: 400;

      letter-spacing: .08em;

    }


    .gallery-note {

      margin:
        5px
        0
        0;

      color:
        rgba(
          234,
          216,
          179,
          .58
        );

      font-size:
        clamp(
          8px,
          .8vw,
          11px
        );

    }



    /* ========================================
       TOP NAV
    ======================================== */

    .card-nav {

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 16px;

    }


    .nav-button {

      min-width: 140px;

      padding:
        8px
        17px;

      border:
        1px solid
        #a77d3c;

      border-radius:
        7px;

      background:
        rgba(
          7,
          13,
          23,
          .90
        );

      color: #ead8b3;

      font-family: inherit;

      font-size: 12px;

      cursor: pointer;

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;

    }


    .nav-button:hover {

      background:
        rgba(
          167,
          125,
          60,
          .16
        );

      border-color: #c99b52;

      transform:
        translateY(-1px);

    }


    .card-number {

      min-width: 105px;

      padding-bottom: 4px;

      border-bottom:
        1px solid
        rgba(
          187,
          143,
          73,
          .70
        );

      color: #f0d7a6;

      text-align: center;

      font-size: 15px;

      letter-spacing: .06em;

    }



    /* ========================================
       VIEWER
    ======================================== */

    .viewer-wrap {

      min-width: 0;
      min-height: 0;

      position: relative;

      display: flex;

      justify-content: center;
      align-items: center;

      overflow: hidden;

    }


    .viewer {

      position: relative;

      height: 100%;

      max-width: 100%;

      overflow: hidden;

      background: transparent;

    }


    /* テイクアウトは2:3 */

    body[data-type="takeout"] .viewer {

      aspect-ratio: 2 / 3;

    }


    /* 線香花火は横長カード */

    body[data-type="sparkler"] .viewer {

      width:
        min(
          100%,
          760px
        );

    }


    #cardViewer {

      display: block;

      width: 100%;
      height: 100%;

      margin: 0;

      border: 0;

      overflow: hidden;

      background: transparent;

    }



    /* ========================================
       SPARKLER
       結果完成まではiframeを見せない
    ======================================== */

    body[data-type="sparkler"] #cardViewer {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transition:
        opacity .28s ease;

    }


    body[data-type="sparkler"].sparkler-ready #cardViewer {

      opacity: 1;

      visibility: visible;

      pointer-events: auto;

    }



    /* ========================================
       LOADING
    ======================================== */

    .loading {

      position: absolute;

      inset: 0;

      z-index: 20;

      display: flex;

      justify-content: center;
      align-items: center;

      color:
        rgba(
          237,
          218,
          178,
          .75
        );

      font-size: 11px;

      letter-spacing: .12em;

      pointer-events: none;

      transition:
        opacity .3s ease,
        visibility .3s ease;

    }


    .loading.is-hidden {

      opacity: 0;

      visibility: hidden;

    }


    .loading-mark {

      display: inline-block;

      margin-right: 9px;

      animation:
        loadingGlow
        1.4s
        ease-in-out
        infinite;

    }


    @keyframes loadingGlow {

      0%,
      100% {

        opacity: .3;

        transform:
          scale(.9);

      }


      50% {

        opacity: 1;

        transform:
          scale(1.12);

      }

    }



    /* ========================================
       BOTTOM
    ======================================== */

    .bottom-actions {

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 14px;

    }


    .bottom-button {

      min-width: 190px;

      padding:
        9px
        22px;

      border:
        1px solid
        #a77d3c;

      border-radius:
        999px;

      background:
        rgba(
          7,
          13,
          23,
          .90
        );

      color: #ead8b3;

      font-family: inherit;

      font-size: 12px;

      text-align: center;

      text-decoration: none;

      cursor: pointer;

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;

    }


    .bottom-button:hover {

      background:
        rgba(
          167,
          125,
          60,
          .16
        );

      border-color: #c99b52;

      transform:
        translateY(-1px);

    }



    /* ========================================
       SHORT SCREEN
    ======================================== */

    @media (max-height: 780px) {

      .gallery {

        gap: 6px;

        padding:
          10px
          14px
          9px;

      }


      .gallery-title {

        font-size: 18px;

      }


      .gallery-note {

        margin-top: 2px;

        font-size: 8px;

      }


      .nav-button {

        padding:
          6px
          14px;

      }


      .bottom-button {

        padding:
          7px
          18px;

      }

    }



    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 650px) {

      .gallery {

        padding:
          10px
          7px
          8px;

        gap: 6px;

      }


      .gallery-title {

        font-size: 17px;

      }


      .gallery-note {

        font-size: 8px;

      }


      .card-nav {

        gap: 6px;

      }


      .nav-button {

        min-width: 0;

        padding:
          7px
          10px;

        font-size: 10px;

      }


      .card-number {

        min-width: 74px;

        font-size: 11px;

      }


      .bottom-actions {

        gap: 7px;

      }


      .bottom-button {

        min-width: 0;

        width:
          min(
            44vw,
            190px
          );

        padding:
          8px
          9px;

        font-size: 10px;

      }

    }

  </style>

</head>



<body>


<main class="gallery">


  <!-- HEADER -->

  <header class="gallery-header">


    <h1
      class="gallery-title"
      id="galleryTitle"
    >
      真夜中珈琲屋台　カードギャラリー
    </h1>


    <p class="gallery-note">

      2026 夏祭り　営業記録

    </p>


  </header>



  <!-- NAV -->

  <nav
    class="card-nav"
    aria-label="カード切り替え"
  >


    <button
      class="nav-button"
      id="prevButton"
      type="button"
    >
      ◀ 前のカード
    </button>


    <div
      class="card-number"
      id="cardNumber"
    >
    </div>


    <button
      class="nav-button"
      id="nextButton"
      type="button"
    >
      次のカード ▶
    </button>


  </nav>



  <!-- VIEWER -->

  <section class="viewer-wrap">


    <div class="viewer">


      <iframe
        id="cardViewer"
        title="真夜中珈琲屋台 カード"
        scrolling="no"
      >
      </iframe>


    </div>



    <div
      class="loading"
      id="loading"
    >

      <span class="loading-mark">
        ✦
      </span>

      <span id="loadingText">
        カードを準備しています
      </span>

    </div>


  </section>



  <!-- BOTTOM -->

  <div class="bottom-actions">


    <button
      class="bottom-button"
      id="listButton"
      type="button"
    >
      ▦ 一覧に戻る
    </button>


    <a
      class="bottom-button"
      href="../index.html"
    >
      ☕ 屋台に戻る
    </a>


  </div>


</main>



<script>


/* ==========================================================
   CARD DATA
========================================================== */


const COLLECTIONS = {


  /* ======================================
     TAKEOUT
  ====================================== */

  takeout: {

    title:
      "真夜中珈琲屋台　テイクアウトカード",

    cards: [

      {
        id: "T-001",
        name: "焦がし蜂蜜ラテ",
        theme: "amber"
      },

      {
        id: "T-002",
        name: "黒糖ミルク珈琲",
        theme: "amber"
      },

      {
        id: "T-003",
        name: "夜風のアイス珈琲",
        theme: "navy"
      },

      {
        id: "T-004",
        name: "星屑ショコラ",
        theme: "rose"
      },

      {
        id: "T-005",
        name: "月夜のカフェオレ",
        theme: "navy"
      },

      {
        id: "T-006",
        name: "真夜中のデカフェ",
        theme: "green"
      },

      {
        id: "T-007",
        name: "猫印の気まぐれ珈琲",
        theme: "purple",
        rarity: "rare"
      }

    ]

  },



  /* ======================================
     SPARKLER
  ====================================== */

  sparkler: {

    title:
      "真夜中珈琲屋台　線香花火カード",

    cards: [

      {
        id: "S-001",
        name: "牡丹",
        rarity: "normal",
        random: 0.0625
      },

      {
        id: "S-002",
        name: "松葉",
        rarity: "normal",
        random: 0.1875
      },

      {
        id: "S-003",
        name: "散り菊",
        rarity: "normal",
        random: 0.3125
      },

      {
        id: "S-004",
        name: "月雫",
        rarity: "rare",
        random: 0.4375
      },

      {
        id: "S-005",
        name: "星結び",
        rarity: "rare",
        random: 0.5625
      },

      {
        id: "S-006",
        name: "願い星",
        rarity: "secret",
        random: 0.6875
      },

      {
        id: "S-007",
        name: "帰り灯",
        rarity: "normal",
        random: 0.8125
      },

      {
        id: "S-008",
        name: "夜凪",
        rarity: "normal",
        random: 0.9375
      }

    ]

  }

};



/* ==========================================================
   ELEMENTS
========================================================== */


const viewer =
  document.getElementById(
    "cardViewer"
  );


const loading =
  document.getElementById(
    "loading"
  );


const loadingText =
  document.getElementById(
    "loadingText"
  );


const galleryTitle =
  document.getElementById(
    "galleryTitle"
  );


const cardNumber =
  document.getElementById(
    "cardNumber"
  );


const prevButton =
  document.getElementById(
    "prevButton"
  );


const nextButton =
  document.getElementById(
    "nextButton"
  );


const listButton =
  document.getElementById(
    "listButton"
  );



/* ==========================================================
   QUERY
========================================================== */


const params =
  new URLSearchParams(
    window.location.search
  );


let currentType =
  params.get(
    "type"
  );


if (
  currentType !== "takeout"
  &&
  currentType !== "sparkler"
) {

  currentType =
    "takeout";

}


let collection =
  COLLECTIONS[
    currentType
  ];


const requestedCard =
  params.get(
    "card"
  );


let currentIndex =
  collection.cards.findIndex(
    card =>
      card.id === requestedCard
  );


if (
  currentIndex < 0
) {

  currentIndex = 0;

}



/* ==========================================================
   GLOBAL STATE
========================================================== */


let sparklerTimer =
  null;


let sparklerClicked =
  new WeakSet();



/* ==========================================================
   LOADING
========================================================== */


function showLoading(
  text = "カードを準備しています"
) {


  document.body.classList.remove(
    "sparkler-ready"
  );


  loadingText.textContent =
    text;


  loading.classList.remove(
    "is-hidden"
  );


}



function hideLoading() {


  loading.classList.add(
    "is-hidden"
  );


}



/* ==========================================================
   URL
========================================================== */


function updateURL() {


  const card =
    collection.cards[
      currentIndex
    ];


  const url =
    new URL(
      window.location.href
    );


  url.searchParams.set(
    "type",
    currentType
  );


  url.searchParams.set(
    "card",
    card.id
  );


  window.history.replaceState(
    {},
    "",
    url
  );


}



/* ==========================================================
   HEADER
========================================================== */


function updateHeader() {


  const card =
    collection.cards[
      currentIndex
    ];


  document.body.dataset.type =
    currentType;


  galleryTitle.textContent =
    collection.title;


  cardNumber.textContent =
    `${card.id} / ${collection.cards.length}`;


}



/* ==========================================================
   TAKEOUT
========================================================== */


function renderTakeoutCard(
  card
) {


  clearSparklerTimer();


  showLoading(
    "テイクアウトカードを準備しています"
  );


  const siteRoot =
    new URL(
      "../",
      window.location.href
    ).href;


  /*
    図鑑用なので個人名は使わない
  */

  const guestName =
    "GUEST";


  const cardDate =
    "2026.09.01";


  const srcdoc = `

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<base href="${siteRoot}">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="css/opening.css"
>


<style>

* {
  box-sizing: border-box;
}


html,
body {

  width: 100%;
  height: 100%;

  margin: 0 !important;
  padding: 0 !important;

  overflow: hidden !important;

  background:
    transparent !important;

}


body {

  min-width:
    0 !important;

  min-height:
    0 !important;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

}


#takeoutCardPreview {

  position:
    relative !important;

  width:
    auto !important;

  height:
    100% !important;

  max-width:
    100% !important;

  max-height:
    100% !important;

  aspect-ratio:
    2 / 3 !important;

  margin:
    0 auto !important;

  overflow:
    hidden !important;

  flex:
    0 0 auto;

}


.takeout-card-base-image {

  position:
    absolute !important;

  inset:
    0 !important;

  display:
    block !important;

  width:
    100% !important;

  height:
    100% !important;

  object-fit:
    fill !important;

}

</style>

</head>


<body>


<article
  id="takeoutCardPreview"
  class="takeout-card-preview"
  data-theme="${card.theme}"
  aria-label="テイクアウトカード"
>


  <img
    class="takeout-card-base-image"
    src="assets/images/takeout-card.png"
    alt="真夜中珈琲屋台 TAKE OUT CARD"
  >


  <span
    class="
      takeout-card-overlay
      takeout-card-cup-name
    "
  >
    ${guestName}
  </span>


  <span
    class="
      takeout-card-overlay
      takeout-card-cup-drink
    "
  >
    ${card.name}
  </span>


  <span
    class="
      takeout-card-overlay
      takeout-card-for
    "
  >
    ${guestName}
  </span>


  <span
    class="
      takeout-card-overlay
      takeout-card-drink
    "
  >
    ${card.name}
  </span>


  <span
    class="
      takeout-card-overlay
      takeout-card-date
    "
  >
    ${cardDate}
  </span>


</article>


</body>

</html>

  `;


  viewer.onload =
    () => {


      setTimeout(
        hideLoading,
        120
      );


    };


  viewer.srcdoc =
    srcdoc;


}



/* ==========================================================
   SPARKLER TIMER
========================================================== */


function clearSparklerTimer() {


  if (
    sparklerTimer
  ) {


    clearInterval(
      sparklerTimer
    );


    sparklerTimer =
      null;


  }


}



/* ==========================================================
   ANALYTICS OFF
   ギャラリー閲覧でイベントを増やさない
========================================================== */


function silenceSparklerAnalytics(
  win
) {


  try {


    win.gtag =
      function () {};


    if (
      Array.isArray(
        win.dataLayer
      )
    ) {


      win.dataLayer.push =
        function () {

          return 0;

        };


    }


    if (
      win.navigator
      &&
      win.navigator.sendBeacon
    ) {


      win.navigator.sendBeacon =
        function () {

          return true;

        };


    }


  }

  catch (_) {}


}



/* ==========================================================
   SPARKLER SPEED
========================================================== */


function speedUpSparklerPage(
  doc
) {


  if (
    doc.getElementById(
      "gallery-sparkler-speed"
    )
  ) {

    return;

  }


  const style =
    doc.createElement(
      "style"
    );


  style.id =
    "gallery-sparkler-speed";


  style.textContent = `

    *,
    *::before,
    *::after {

      animation-duration:
        .04s !important;

      animation-delay:
        0s !important;

      transition-duration:
        .04s !important;

      transition-delay:
        0s !important;

    }

  `;


  doc.head.appendChild(
    style
  );


}



/* ==========================================================
   VISIBLE BUTTON CHECK
========================================================== */


function isVisibleButton(
  win,
  element
) {


  if (
    !element
    ||
    element.disabled
  ) {

    return false;

  }


  const style =
    win.getComputedStyle(
      element
    );


  if (
    style.display === "none"
    ||
    style.visibility === "hidden"
    ||
    Number(style.opacity) === 0
  ) {

    return false;

  }


  const rect =
    element.getBoundingClientRect();


  return (
    rect.width > 0
    &&
    rect.height > 0
  );


}



/* ==========================================================
   AUTO CLICK
========================================================== */


function autoClickSparkler(
  win,
  doc
) {


  const allowedTexts = [

    "線香花火を選ぶ",
    "花火を選ぶ",
    "一本選ぶ",
    "一本もらう",

    "火をつける",

    "願い事をする",

    "結果を見る",
    "結果を受け取る",
    "カードを見る"

  ];


  doc
    .querySelectorAll(
      "button, [role='button']"
    )
    .forEach(
      button => {


        if (
          sparklerClicked.has(
            button
          )
        ) {

          return;

        }


        if (
          !isVisibleButton(
            win,
            button
          )
        ) {

          return;

        }


        const text =
          button.textContent
            .replace(/\s+/g, "")
            .trim();


        /*
          ギャラリーでは再プレイを押さない
        */

        if (
          text.includes(
            "もう一度"
          )
          ||
          text.includes(
            "もう一本"
          )
        ) {

          return;

        }


        const matched =
          allowedTexts.some(
            label =>
              text.includes(
                label.replace(/\s+/g, "")
              )
          );


        if (
          !matched
        ) {

          return;

        }


        sparklerClicked.add(
          button
        );


        try {


          button.click();


        }

        catch (_) {}


      }
    );


}



/* ==========================================================
   FIND SPARKLER RESULT CARD
========================================================== */


function findSparklerResultCard(
  doc,
  card
) {


  const selectors = [

    ".sparkler-result-card",

    ".sparkler-card",

    ".result-card",

    "[class*='sparkler'][class*='card']",

    "[class*='result'][class*='card']",

    "article",

    "section",

    "div"

  ];


  const candidates =
    new Set();


  selectors.forEach(
    selector => {


      doc
        .querySelectorAll(
          selector
        )
        .forEach(
          element =>
            candidates.add(
              element
            )
        );


    }
  );


  const scored =
    [];


  candidates.forEach(
    element => {


      if (
        !element
        ||
        element.hidden
      ) {

        return;

      }


      const text =
        (
          element.textContent
          ||
          ""
        )
        .replace(/\s+/g, " ")
        .trim();


      /*
        指定した結果名が必須
      */

      if (
        !text.includes(
          card.name
        )
      ) {

        return;

      }


      const rect =
        element.getBoundingClientRect();


      /*
        小さすぎる文字要素を除外
      */

      if (
        rect.width < 280
        ||
        rect.height < 260
      ) {

        return;

      }


      let score =
        0;


      if (
        text.includes(
          "TONIGHT'S SPARKLER"
        )
        ||
        text.includes(
          "TONIGHT’S SPARKLER"
        )
      ) {

        score += 30;

      }


      if (
        text.includes(
          card.name
        )
      ) {

        score += 15;

      }


      if (
        text.includes(
          "NORMAL"
        )
        ||
        text.includes(
          "RARE"
        )
        ||
        text.includes(
          "SECRET"
        )
      ) {

        score += 7;

      }


      if (
        text.includes(
          "今夜の色"
        )
      ) {

        score += 5;

      }


      if (
        text.includes(
          "持ち帰る言葉"
        )
      ) {

        score += 5;

      }



      /*
        3つの操作ボタンを含む親箱は
        カード本体ではないので大幅減点
      */

      const unwantedTexts = [

        "Xでシェア",

        "屋台に戻る",

        "もう一本だけ選ぶ",

        "もう一本選ぶ",

        "もう一度"

      ];


      unwantedTexts.forEach(
        word => {


          if (
            text.includes(
              word
            )
          ) {

            score -= 30;

          }


        }
      );


      scored.push({

        element,

        score,

        area:
          rect.width
          *
          rect.height

      });


    }
  );


  scored.sort(
    (a, b) => {


      if (
        b.score !== a.score
      ) {

        return (
          b.score
          -
          a.score
        );

      }


      /*
        同点なら小さい領域を優先。
        親コンテナではなく
        カード本体を拾うため。
      */

      return (
        a.area
        -
        b.area
      );


    }
  );


  if (
    scored.length === 0
  ) {

    return null;

  }


  /*
    カードらしい点数のものだけ採用
  */

  if (
    scored[0].score < 20
  ) {

    return null;

  }


  return (
    scored[0].element
  );


}



/* ==========================================================
   HIDE ORIGINAL BUTTONS
========================================================== */


function hideSparklerOriginalControls(
  doc,
  cardElement
) {


  const targetTexts = [

    "Xでシェア",

    "屋台に戻る",

    "もう一本だけ選ぶ",

    "もう一本選ぶ",

    "もう一度",

    "シェア"

  ];


  /*
    a/button は結果カード外なら全部消す
  */

  doc
    .querySelectorAll(
      "a, button"
    )
    .forEach(
      element => {


        if (
          cardElement
          &&
          element.closest(
            ".sparkler-result-card, .sparkler-card, .result-card"
          )
          ===
          cardElement
        ) {

          return;

        }


        const text =
          element.textContent
            .replace(/\s+/g, "")
            .trim();


        const matched =
          targetTexts.some(
            word =>
              text.includes(
                word.replace(/\s+/g, "")
              )
          );


        if (
          matched
          ||
          !element.closest(
            ".sparkler-result-card, .sparkler-card, .result-card"
          )
        ) {


          element.style.setProperty(
            "display",
            "none",
            "important"
          );


        }


      }
    );


}



/* ==========================================================
   FIT SPARKLER CARD
========================================================== */


function fitSparklerCard(
  doc,
  cardElement
) {


  if (
    !cardElement
  ) {

    return;

  }


  /*
    transform解除して
    元サイズを測る
  */

  cardElement.style.setProperty(
    "animation",
    "none",
    "important"
  );


  cardElement.style.setProperty(
    "opacity",
    "1",
    "important"
  );


  cardElement.style.setProperty(
    "visibility",
    "visible",
    "important"
  );


  cardElement.style.setProperty(
    "display",
    "block",
    "important"
  );


  cardElement.style.setProperty(
    "transform",
    "none",
    "important"
  );


  cardElement.style.setProperty(
    "position",
    "fixed",
    "important"
  );


  cardElement.style.setProperty(
    "left",
    "50%",
    "important"
  );


  cardElement.style.setProperty(
    "top",
    "50%",
    "important"
  );


  cardElement.style.setProperty(
    "margin",
    "0",
    "important"
  );


  cardElement.style.setProperty(
    "z-index",
    "999999",
    "important"
  );


  const width =
    cardElement.offsetWidth;


  const height =
    cardElement.offsetHeight;


  if (
    !width
    ||
    !height
  ) {

    return;

  }


  const availableWidth =
    Math.max(
      1,
      viewer.clientWidth - 8
    );


  const availableHeight =
    Math.max(
      1,
      viewer.clientHeight - 8
    );


  const scale =
    Math.min(

      availableWidth
      /
      width,

      availableHeight
      /
      height,

      1

    );


  cardElement.style.setProperty(
    "transform-origin",
    "center center",
    "important"
  );


  cardElement.style.setProperty(

    "transform",

    `translate(-50%, -50%) scale(${scale})`,

    "important"

  );


}



/* ==========================================================
   ISOLATE SPARKLER RESULT CARD
========================================================== */


function isolateSparklerCard(
  doc,
  cardElement
) {


  if (
    !cardElement
  ) {

    return;

  }



  /* ======================================
     ギャラリー専用CSS
  ====================================== */

  let style =
    doc.getElementById(
      "gallery-sparkler-result-style"
    );


  if (
    !style
  ) {


    style =
      doc.createElement(
        "style"
      );


    style.id =
      "gallery-sparkler-result-style";


    style.textContent = `


      html,
      body {

        width:
          100% !important;

        height:
          100% !important;

        min-width:
          0 !important;

        min-height:
          0 !important;

        margin:
          0 !important;

        padding:
          0 !important;

        overflow:
          hidden !important;

        background:
          transparent !important;

      }


      /*
        本番側の操作UIを
        ギャラリーでは非表示
      */

      .actions,
      .action-buttons,
      .result-actions,
      .share-buttons,
      .share-button,
      .sparkler-actions,
      .sparkler-result-actions,
      .result-buttons,
      .button-area,
      .retry-button,
      .back-button,
      .again-button {

        display:
          none !important;

      }


    `;


    doc.head.appendChild(
      style
    );


  }



  /* ======================================
     ボタンを文字でも確実に消す
  ====================================== */


  hideSparklerOriginalControls(
    doc,
    cardElement
  );



  /* ======================================
     カードからBODYへ遡り
     兄弟要素を全部非表示
  ====================================== */


  let node =
    cardElement;


  while (
    node
    &&
    node !== doc.body
  ) {


    node.hidden =
      false;


    node.style.removeProperty(
      "display"
    );


    const parent =
      node.parentElement;


    if (
      parent
    ) {


      Array
        .from(
          parent.children
        )
        .forEach(
          sibling => {


            if (
              sibling !== node
            ) {


              sibling.style.setProperty(
                "display",
                "none",
                "important"
              );


            }


          }
        );


    }


    node =
      parent;


  }



  /* ======================================
     BODY
  ====================================== */


  doc.documentElement.style.setProperty(
    "width",
    "100%",
    "important"
  );


  doc.documentElement.style.setProperty(
    "height",
    "100%",
    "important"
  );


  doc.documentElement.style.setProperty(
    "overflow",
    "hidden",
    "important"
  );


  doc.body.style.setProperty(
    "width",
    "100%",
    "important"
  );


  doc.body.style.setProperty(
    "height",
    "100%",
    "important"
  );


  doc.body.style.setProperty(
    "min-height",
    "0",
    "important"
  );


  doc.body.style.setProperty(
    "margin",
    "0",
    "important"
  );


  doc.body.style.setProperty(
    "padding",
    "0",
    "important"
  );


  doc.body.style.setProperty(
    "overflow",
    "hidden",
    "important"
  );


  doc.body.style.setProperty(
    "background",
    "transparent",
    "important"
  );



  /* ======================================
     CARD
  ====================================== */


  cardElement.style.setProperty(
    "animation",
    "none",
    "important"
  );


  cardElement.style.setProperty(
    "opacity",
    "1",
    "important"
  );


  cardElement.style.setProperty(
    "visibility",
    "visible",
    "important"
  );


  cardElement.style.setProperty(
    "display",
    "block",
    "important"
  );


  fitSparklerCard(
    doc,
    cardElement
  );


}



/* ==========================================================
   RENDER SPARKLER
========================================================== */


function renderSparklerCard(
  card
) {


  clearSparklerTimer();


  sparklerClicked =
    new WeakSet();


  document.body.classList.remove(
    "sparkler-ready"
  );


  showLoading(
    "線香花火カードを準備しています"
  );


  /*
    TAKEOUTで使ったsrcdocを解除
  */

  viewer.removeAttribute(
    "srcdoc"
  );


  viewer.onload =
    () => {


      try {


        const win =
          viewer.contentWindow;


        const doc =
          viewer.contentDocument
          ||
          win.document;



        /*
          ギャラリー閲覧は
          アクセス解析に追加しない
        */

        silenceSparklerAnalytics(
          win
        );



        /*
          目的カードを出すため
          乱数を固定
        */

        try {


          win.Math.random =
            () =>
              card.random;


        }

        catch (_) {}



        /*
          演出を高速化。
          iframe自体はまだ非表示。
        */

        speedUpSparklerPage(
          doc
        );



        let attempts =
          0;



        sparklerTimer =
          window.setInterval(
            () => {


              attempts += 1;



              /* ----------------------------
                 結果カードを探す
              ---------------------------- */


              const resultCard =
                findSparklerResultCard(
                  doc,
                  card
                );



              if (
                resultCard
              ) {


                clearSparklerTimer();



                /*
                  まず裏で
                  カードだけに整える
                */

                isolateSparklerCard(
                  doc,
                  resultCard
                );



                /*
                  少し遅れて出るボタンも
                  もう一度消す
                */

                setTimeout(
                  () => {


                    isolateSparklerCard(
                      doc,
                      resultCard
                    );


                  },
                  80
                );



                setTimeout(
                  () => {


                    isolateSparklerCard(
                      doc,
                      resultCard
                    );


                  },
                  180
                );



                /*
                  整形後に初めて
                  iframeを表示
                */

                requestAnimationFrame(
                  () => {


                    document.body.classList.add(
                      "sparkler-ready"
                    );


                    hideLoading();


                  }
                );



                /*
                  フォント・画像反映後にも
                  サイズ調整
                */

                setTimeout(
                  () => {


                    fitSparklerCard(
                      doc,
                      resultCard
                    );


                  },
                  300
                );


                setTimeout(
                  () => {


                    fitSparklerCard(
                      doc,
                      resultCard
                    );


                  },
                  800
                );


                setTimeout(
                  () => {


                    hideSparklerOriginalControls(
                      doc,
                      resultCard
                    );


                    fitSparklerCard(
                      doc,
                      resultCard
                    );


                  },
                  1500
                );


                return;


              }



              /* ----------------------------
                 結果がまだなら
                 裏で操作を進める
              ---------------------------- */


              autoClickSparkler(
                win,
                doc
              );



              /*
                最大約24秒
              */

              if (
                attempts > 300
              ) {


                clearSparklerTimer();


                loadingText.textContent =
                  "カードの表示を確認中です…";


              }


            },
            80
          );


      }


      catch (error) {


        console.log(
          "sparkler gallery:",
          error
        );


        loadingText.textContent =
          "カードを準備しています…";


      }


    };



  /*
    キャッシュで前カードが残らないよう
    毎回URLを変える
  */

  viewer.src =
    `../sparkler/index.html?gallery=${encodeURIComponent(card.id)}&t=${Date.now()}`;


}



/* ==========================================================
   SHOW CARD
========================================================== */


function showCard(
  index
) {


  clearSparklerTimer();


  currentIndex =

    (
      index
      +
      collection.cards.length
    )

    %

    collection.cards.length;



  const card =
    collection.cards[
      currentIndex
    ];



  updateHeader();


  updateURL();



  if (
    currentType === "takeout"
  ) {


    renderTakeoutCard(
      card
    );


    return;


  }


  renderSparklerCard(
    card
  );


}



/* ==========================================================
   PREVIOUS
========================================================== */


prevButton.addEventListener(
  "click",
  () => {


    showCard(
      currentIndex - 1
    );


  }
);



/* ==========================================================
   NEXT
========================================================== */


nextButton.addEventListener(
  "click",
  () => {


    showCard(
      currentIndex + 1
    );


  }
);



/* ==========================================================
   KEYBOARD
========================================================== */


window.addEventListener(
  "keydown",
  event => {


    if (
      event.key ===
      "ArrowLeft"
    ) {


      showCard(
        currentIndex - 1
      );


    }


    if (
      event.key ===
      "ArrowRight"
    ) {


      showCard(
        currentIndex + 1
      );


    }


  }
);



/* ==========================================================
   LIST
========================================================== */


listButton.addEventListener(
  "click",
  () => {


    const referrer =
      document.referrer
      ||
      "";


    /*
      list.htmlから来た場合は
      「戻る」で選択中カテゴリも
      そのまま残りやすい
    */

    if (
      referrer.includes(
        "/gallery/list.html"
      )
    ) {


      window.history.back();


      return;


    }


    window.location.href =
      "./list.html";


  }
);



/* ==========================================================
   RESIZE
========================================================== */


window.addEventListener(
  "resize",
  () => {


    if (
      currentType !==
      "sparkler"
    ) {

      return;

    }


    try {


      const doc =
        viewer.contentDocument;


      if (
        !doc
      ) {

        return;

      }


      const resultCard =
        findSparklerResultCard(
          doc,
          collection.cards[
            currentIndex
          ]
        );


      if (
        !resultCard
      ) {

        return;

      }


      requestAnimationFrame(
        () => {


          fitSparklerCard(
            doc,
            resultCard
          );


        }
      );


    }

    catch (_) {}


  }
);



/* ==========================================================
   START
========================================================== */


showCard(
  currentIndex
);


</script>
