<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    真夜中珈琲屋台｜カードギャラリー
  </title>


  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    /* ========================================
       RESET
    ======================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

    }


    body {

      color: #ead8b3;

      font-family:
        "Noto Serif JP",
        "Yu Mincho",
        serif;


      background:

        radial-gradient(
          circle at 15% 20%,
          rgba(255,255,255,.11) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 72% 14%,
          rgba(255,255,255,.08) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 88% 65%,
          rgba(255,255,255,.08) 0 1px,
          transparent 1.5px
        ),

        radial-gradient(
          circle at 42% 84%,
          rgba(255,255,255,.06) 0 1px,
          transparent 1.5px
        ),

        linear-gradient(
          180deg,
          #07111f 0%,
          #050912 100%
        );

      background-size:
        170px 170px,
        240px 240px,
        310px 310px,
        220px 220px,
        auto;

    }



    /* ========================================
       PAGE
    ======================================== */

    .gallery {

      width: 100%;
      height: 100vh;

      display: grid;

      grid-template-rows:
        auto
        auto
        minmax(0, 1fr)
        auto;

      gap: 9px;

      padding:
        18px
        18px
        14px;

    }



    /* ========================================
       HEADER
    ======================================== */

    .gallery-header {

      text-align: center;

      line-height: 1.3;

    }


    .gallery-title {

      margin: 0;

      color: #efd8aa;

      font-size:
        clamp(
          19px,
          2vw,
          27px
        );

      font-weight: 400;

      letter-spacing: .08em;

    }


    .gallery-note {

      margin:
        5px
        0
        0;

      color:
        rgba(
          234,
          216,
          179,
          .58
        );

      font-size:
        clamp(
          8px,
          .8vw,
          11px
        );

    }



    /* ========================================
       NAV
    ======================================== */

    .card-nav {

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 16px;

    }


    .nav-button {

      min-width: 140px;

      padding:
        8px
        17px;

      border:
        1px solid
        #a77d3c;

      border-radius:
        7px;

      background:
        rgba(
          7,
          13,
          23,
          .90
        );

      color: #ead8b3;

      font-family: inherit;

      font-size: 12px;

      cursor: pointer;

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;

    }


    .nav-button:hover {

      background:
        rgba(
          167,
          125,
          60,
          .16
        );

      border-color:
        #c99b52;

      transform:
        translateY(-1px);

    }


    .card-number {

      min-width: 124px;

      padding-bottom: 4px;

      border-bottom:
        1px solid
        rgba(
          187,
          143,
          73,
          .70
        );

      color: #f0d7a6;

      text-align: center;

      font-size: 15px;

      letter-spacing: .06em;

    }



    /* ========================================
       VIEWER
    ======================================== */

    .viewer-wrap {

      min-width: 0;
      min-height: 0;

      position: relative;

      display: flex;

      justify-content: center;
      align-items: center;

      overflow: hidden;

    }


    .viewer {

      position: relative;

      display: flex;

      justify-content: center;
      align-items: center;

      width: 100%;
      height: 100%;

      max-width: 100%;
      max-height: 100%;

      overflow: hidden;

      background: transparent;

    }


    /*
      テイクアウト用
    */

    body[data-type="takeout"] .viewer {

      aspect-ratio: 2 / 3;

      width: auto;
      height: 100%;
      max-width: 100%;

    }


    /*
      線香花火用
    */

    body[data-type="sparkler"] .viewer {

      width:
        min(
          100%,
          940px
        );

      height: 100%;

    }


    #cardViewer,
    #imageViewer {

      display: none;

      border: 0;
      margin: 0;

      background: transparent;

    }


    body[data-type="takeout"] #cardViewer {

      display: block;

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    body[data-type="sparkler"] #imageViewer {

      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      filter:
        drop-shadow(0 10px 28px rgba(0,0,0,.30));

    }



    /* ========================================
       LOADING
    ======================================== */

    .loading {

      position: absolute;

      inset: 0;

      z-index: 20;

      display: flex;

      justify-content: center;
      align-items: center;

      color:
        rgba(
          237,
          218,
          178,
          .75
        );

      font-size: 11px;

      letter-spacing: .12em;

      pointer-events: none;

      transition:
        opacity .3s ease,
        visibility .3s ease;

    }


    .loading.is-hidden {

      opacity: 0;
      visibility: hidden;

    }


    .loading-mark {

      display: inline-block;

      margin-right: 9px;

      animation:
        loadingGlow
        1.4s
        ease-in-out
        infinite;

    }


    @keyframes loadingGlow {

      0%,
      100% {

        opacity: .3;
        transform: scale(.9);

      }

      50% {

        opacity: 1;
        transform: scale(1.12);

      }

    }



    /* ========================================
       BOTTOM
    ======================================== */

    .bottom-actions {

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 14px;

    }


    .bottom-button {

      min-width: 190px;

      padding:
        9px
        22px;

      border:
        1px solid
        #a77d3c;

      border-radius:
        999px;

      background:
        rgba(
          7,
          13,
          23,
          .90
        );

      color: #ead8b3;

      font-family: inherit;

      font-size: 12px;

      text-align: center;

      text-decoration: none;

      cursor: pointer;

      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;

    }


    .bottom-button:hover {

      background:
        rgba(
          167,
          125,
          60,
          .16
        );

      border-color:
        #c99b52;

      transform:
        translateY(-1px);

    }



    /* ========================================
       SHORT SCREEN
    ======================================== */

    @media (max-height: 780px) {

      .gallery {

        gap: 6px;

        padding:
          10px
          14px
          9px;

      }


      .gallery-title {

        font-size: 18px;

      }


      .gallery-note {

        margin-top: 2px;
        font-size: 8px;

      }


      .nav-button {

        padding:
          6px
          14px;

      }


      .bottom-button {

        padding:
          7px
          18px;

      }

    }



    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 650px) {

      .gallery {

        padding:
          10px
          7px
          8px;

        gap: 6px;

      }


      .gallery-title {

        font-size: 17px;

      }


      .gallery-note {

        font-size: 8px;

      }


      .card-nav {

        gap: 6px;

      }


      .nav-button {

        min-width: 0;

        padding:
          7px
          10px;

        font-size: 10px;

      }


      .card-number {

        min-width: 84px;
        font-size: 11px;

      }


      .bottom-actions {

        gap: 7px;

      }


      .bottom-button {

        min-width: 0;

        width:
          min(
            44vw,
            190px
          );

        padding:
          8px
          9px;

        font-size: 10px;

      }

    }

  </style>

</head>



<body>


<main class="gallery">


  <!-- ========================================
       HEADER
  ========================================= -->

  <header class="gallery-header">

    <h1
      class="gallery-title"
      id="galleryTitle"
    >
      真夜中珈琲屋台　カードギャラリー
    </h1>

    <p class="gallery-note">
      2026 夏祭り　営業記録
    </p>

  </header>



  <!-- ========================================
       NAV
  ========================================= -->

  <nav
    class="card-nav"
    aria-label="カード切り替え"
  >

    <button
      class="nav-button"
      id="prevButton"
      type="button"
    >
      ◀ 前のカード
    </button>

    <div
      class="card-number"
      id="cardNumber"
    >
    </div>

    <button
      class="nav-button"
      id="nextButton"
      type="button"
    >
      次のカード ▶
    </button>

  </nav>



  <!-- ========================================
       VIEWER
  ========================================= -->

  <section class="viewer-wrap">

    <div class="viewer">

      <iframe
        id="cardViewer"
        title="真夜中珈琲屋台 テイクアウトカード"
        scrolling="no"
      >
      </iframe>

      <img
        id="imageViewer"
        alt=""
      >

    </div>

    <div
      class="loading"
      id="loading"
    >
      <span class="loading-mark">
        ✦
      </span>
      <span id="loadingText">
        カードを準備しています
      </span>
    </div>

  </section>



  <!-- ========================================
       BOTTOM
  ========================================= -->

  <div class="bottom-actions">

    <button
      class="bottom-button"
      id="listButton"
      type="button"
    >
      ▦ 一覧に戻る
    </button>

    <a
      class="bottom-button"
      href="../index.html"
    >
      ☕ 屋台に戻る
    </a>

  </div>


</main>



<script>

  /* ==========================================================
     DATA
  ========================================================== */

  const COLLECTIONS = {

    takeout: {

      title:
        "真夜中珈琲屋台　テイクアウトカード",

      cards: [

        {
          id: "T-001",
          name: "焦がし蜂蜜ラテ",
          theme: "amber"
        },

        {
          id: "T-002",
          name: "黒糖ミルク珈琲",
          theme: "amber"
        },

        {
          id: "T-003",
          name: "夜風のアイス珈琲",
          theme: "navy"
        },

        {
          id: "T-004",
          name: "星屑ショコラ",
          theme: "rose"
        },

        {
          id: "T-005",
          name: "月夜のカフェオレ",
          theme: "navy"
        },

        {
          id: "T-006",
          name: "真夜中のデカフェ",
          theme: "green"
        },

        {
          id: "T-007",
          name: "猫印の気まぐれ珈琲",
          theme: "purple"
        }

      ]

    },


    sparkler: {

      title:
        "真夜中珈琲屋台　線香花火カード",

      cards: [

        {
          id: "S-001",
          name: "牡丹",
          image: "../assets/images/gallery/sparkler/S-001_牡丹.png"
        },

        {
          id: "S-002",
          name: "松葉",
          image: "../assets/images/gallery/sparkler/S-002_松葉.png"
        },

        {
          id: "S-003",
          name: "散り菊",
          image: "../assets/images/gallery/sparkler/S-003_散り菊.png"
        },

        {
          id: "S-004",
          name: "月雫",
          image: "../assets/images/gallery/sparkler/S-004_月雫.png"
        },

        {
          id: "S-005",
          name: "星結び",
          image: "../assets/images/gallery/sparkler/S-005_星結び.png"
        },

        {
          id: "S-006",
          name: "願い星",
          image: "../assets/images/gallery/sparkler/S-006_願い星.png"
        },

        {
          id: "S-007",
          name: "帰り灯",
          image: "../assets/images/gallery/sparkler/S-007_帰り灯.png"
        },

        {
          id: "S-008",
          name: "夜凪",
          image: "../assets/images/gallery/sparkler/S-008_夜凪.png"
        }

      ]

    }

  };



  /* ==========================================================
     ELEMENTS
  ========================================================== */

  const cardViewer =
    document.getElementById(
      "cardViewer"
    );

  const imageViewer =
    document.getElementById(
      "imageViewer"
    );

  const loading =
    document.getElementById(
      "loading"
    );

  const loadingText =
    document.getElementById(
      "loadingText"
    );

  const galleryTitle =
    document.getElementById(
      "galleryTitle"
    );

  const cardNumber =
    document.getElementById(
      "cardNumber"
    );

  const prevButton =
    document.getElementById(
      "prevButton"
    );

  const nextButton =
    document.getElementById(
      "nextButton"
    );

  const listButton =
    document.getElementById(
      "listButton"
    );



  /* ==========================================================
     QUERY
  ========================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );

  let currentType =
    params.get("type");

  if (
    currentType !== "takeout"
    &&
    currentType !== "sparkler"
  ) {
    currentType = "takeout";
  }

  let collection =
    COLLECTIONS[currentType];

  const requestedCard =
    params.get("card");

  let currentIndex =
    collection.cards.findIndex(
      card =>
        card.id === requestedCard
    );

  if (
    currentIndex < 0
  ) {
    currentIndex = 0;
  }



  /* ==========================================================
     LOADING
  ========================================================== */

  function showLoading(
    text = "カードを準備しています"
  ) {

    loadingText.textContent =
      text;

    loading.classList.remove(
      "is-hidden"
    );

  }


  function hideLoading() {

    loading.classList.add(
      "is-hidden"
    );

  }



  /* ==========================================================
     URL
  ========================================================== */

  function updateURL() {

    const card =
      collection.cards[currentIndex];

    const url =
      new URL(
        window.location.href
      );

    url.searchParams.set(
      "type",
      currentType
    );

    url.searchParams.set(
      "card",
      card.id
    );

    window.history.replaceState(
      {},
      "",
      url
    );

  }



  /* ==========================================================
     HEADER
  ========================================================== */

  function updateHeader() {

    const card =
      collection.cards[currentIndex];

    document.body.dataset.type =
      currentType;

    galleryTitle.textContent =
      collection.title;

    cardNumber.textContent =
      `${card.id} / ${collection.cards.length}`;

  }



  /* ==========================================================
     TAKEOUT
  ========================================================== */

  function renderTakeoutCard(
    card
  ) {

    showLoading(
      "テイクアウトカードを準備しています"
    );

    imageViewer.removeAttribute(
      "src"
    );
    imageViewer.alt = "";

    const siteRoot =
      new URL(
        "../",
        window.location.href
      ).href;

    const guestName =
      "GUEST";

    const cardDate =
      "2026.09.01";

    const srcdoc = `

<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<base href="${siteRoot}">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="css/opening.css"
>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0 !important;
  padding: 0 !important;
  overflow: hidden !important;
  background: transparent !important;
}

body {
  min-width: 0 !important;
  min-height: 0 !important;
  display: flex;
  align-items: center;
  justify-content: center;
}

#takeoutCardPreview {
  position: relative !important;
  width: auto !important;
  height: 100% !important;
  max-width: 100% !important;
  max-height: 100% !important;
  aspect-ratio: 2 / 3 !important;
  margin: 0 auto !important;
  overflow: hidden !important;
  flex: 0 0 auto;
}

.takeout-card-base-image {
  position: absolute !important;
  inset: 0 !important;
  display: block !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: fill !important;
}

</style>

</head>

<body>

<article
  id="takeoutCardPreview"
  class="takeout-card-preview"
  data-theme="${card.theme}"
  aria-label="テイクアウトカード"
>

  <img
    class="takeout-card-base-image"
    src="assets/images/takeout-card.png"
    alt="真夜中珈琲屋台 TAKE OUT CARD"
  >

  <span
    class="takeout-card-overlay takeout-card-cup-name"
  >
    ${guestName}
  </span>

  <span
    class="takeout-card-overlay takeout-card-cup-drink"
  >
    ${card.name}
  </span>

  <span
    class="takeout-card-overlay takeout-card-for"
  >
    ${guestName}
  </span>

  <span
    class="takeout-card-overlay takeout-card-drink"
  >
    ${card.name}
  </span>

  <span
    class="takeout-card-overlay takeout-card-date"
  >
    ${cardDate}
  </span>

</article>

</body>
</html>
    `;

    cardViewer.onload =
      () => {
        setTimeout(
          hideLoading,
          120
        );
      };

    cardViewer.srcdoc =
      srcdoc;

  }



  /* ==========================================================
     SPARKLER
  ========================================================== */

  function renderSparklerCard(
    card
  ) {

    showLoading(
      "線香花火カードを準備しています"
    );

    cardViewer.removeAttribute(
      "srcdoc"
    );

    imageViewer.alt =
      `線香花火カード ${card.id} ${card.name}`;

    imageViewer.onload =
      () => {
        setTimeout(
          hideLoading,
          100
        );
      };

    imageViewer.onerror =
      () => {
        loadingText.textContent =
          "画像が見つかりませんでした";
      };

    imageViewer.src =
      card.image;

  }



  /* ==========================================================
     SHOW CARD
  ========================================================== */

  function showCard(
    index
  ) {

    currentIndex =
      (
        index
        +
        collection.cards.length
      )
      %
      collection.cards.length;

    const card =
      collection.cards[currentIndex];

    updateHeader();
    updateURL();

    if (
      currentType === "takeout"
    ) {
      renderTakeoutCard(card);
      return;
    }

    renderSparklerCard(card);

  }



  /* ==========================================================
     PREV / NEXT
  ========================================================== */

  prevButton.addEventListener(
    "click",
    () => {
      showCard(currentIndex - 1);
    }
  );

  nextButton.addEventListener(
    "click",
    () => {
      showCard(currentIndex + 1);
    }
  );



  /* ==========================================================
     KEYBOARD
  ========================================================== */

  window.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "ArrowLeft"
      ) {
        showCard(currentIndex - 1);
      }

      if (
        event.key === "ArrowRight"
      ) {
        showCard(currentIndex + 1);
      }

    }
  );



  /* ==========================================================
     LIST
  ========================================================== */

  listButton.addEventListener(
    "click",
    () => {

      const referrer =
        document.referrer || "";

      if (
        referrer.includes(
          "/gallery/list.html"
        )
      ) {
        window.history.back();
        return;
      }

      window.location.href =
        "./list.html";

    }
  );



  /* ==========================================================
     START
  ========================================================== */

  showCard(currentIndex);

</script>


</body>

</html>
