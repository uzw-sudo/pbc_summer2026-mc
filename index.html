<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101d">

  <title>真夜中珈琲屋台</title>
  <meta name="description" content="眠れない夜にだけ現れる、真夜中の珈琲屋台。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@400;500;600&family=Yuji Syuku&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./css/opening.css">
</head>

<body>
  <canvas id="nightSky" class="night-sky" aria-hidden="true"></canvas>

  <main class="opening-page">
    <section class="opening-scene" aria-labelledby="openingTitle">

      <div class="moon-wrap">
        <button id="moonButton" class="moon-button" type="button" aria-label="月明かりをたどって屋台へ入る">
          <span class="moon" aria-hidden="true"></span>
          <span class="moon-glow" aria-hidden="true"></span>
        </button>
      </div>

      <div class="opening-copy">
        <p class="opening-kicker">OPEN ONLY AFTER MIDNIGHT</p>

        <h1 id="openingTitle">真夜中珈琲屋台</h1>

        <p class="opening-lead">
          眠れない夜にだけ、<br>
          ひっそり灯る珈琲屋台。
        </p>

        <button id="enterButton" class="enter-button" type="button">
          <span class="button-en">FOLLOW THE LIGHT</span>
          <span class="button-ja">灯りをたどる</span>
        </button>

        <p class="opening-note">
          音を立てずに、そっとお入りください。
        </p>
      </div>

      <div class="ground-haze" aria-hidden="true"></div>

      <!-- SECRET: 暗がりの猫 -->
      <button id="catEyesButton" class="cat-eyes-button" type="button" aria-label="暗がりで光る二つの目">
        <span class="cat-eye cat-eye-left" aria-hidden="true"></span>
        <span class="cat-eye cat-eye-right" aria-hidden="true"></span>
      </button>
    </section>

    <!-- SECRET TAKE OUT -->
    <div id="catTakeoutModal" class="cat-takeout-modal" aria-hidden="true">
      <div class="cat-takeout-backdrop" data-cat-close></div>

      <section class="cat-takeout-dialog" role="dialog" aria-modal="true" aria-labelledby="catTakeoutTitle">
        <button id="catTakeoutClose" class="cat-takeout-close" type="button" aria-label="閉じる">×</button>

        <div class="cat-silhouette" aria-hidden="true">
          <span class="cat-ear cat-ear-left"></span>
          <span class="cat-ear cat-ear-right"></span>
          <span class="cat-face-eye cat-face-eye-left"></span>
          <span class="cat-face-eye cat-face-eye-right"></span>
        </div>

        <!-- STEP 1 : 名前 -->
        <div id="catNameStep" class="cat-takeout-step">
          <h2 id="catTakeoutTitle" class="cat-speech-bubble">にゃ…！みっかっちゃったにゃ…</h2>
          <p class="cat-takeout-kicker">SECRET TAKE OUT</p>
          <p class="cat-takeout-message">
            あ、お前…どこ行ってたんだよ…<br>
            つか見つけてくれてありがとなぁ？<br>
            お礼に、これ、持ってけ
          </p>

          <label class="cat-name-label" for="catGuestName">カップに書く名前</label>
          <input id="catGuestName" class="cat-name-input" type="text" maxlength="16" autocomplete="off"
            placeholder="お名前">
          <p id="catNameError" class="cat-name-error" aria-live="polite"></p>

          <button id="catReceiveButton" class="cat-receive-button" type="button">
            一杯、受け取る
          </button>
        </div>

        <!-- STEP 2 : カップ -->
        <div id="catCupStep" class="cat-takeout-step cat-cup-step" hidden>
          <p class="cat-takeout-kicker">MIDNIGHT COFFEE STAND / TAKE OUT</p>
          <h2>ん、これな。</h2>
          <p class="cat-takeout-message cat-cup-message">
            帰り道、冷める前に飲めよ。
          </p>

          <div class="takeout-cup-art" aria-label="名前入りテイクアウトカップ">
            <img src="./assets/images/takeout-cup.png" alt="" class="takeout-cup-image">
            <span id="catCupName" class="takeout-cup-name"></span>
            <span id="catCupDrink" class="takeout-cup-drink"></span>
          </div>

          <p id="catDrinkName" class="cat-drink-name"></p>
          <p id="catDrinkNote" class="cat-drink-note"></p>

          <button id="catDoneButton" class="cat-done-button" type="button">
            持って帰る
          </button>
        </div>

        <!-- STEP 3 : 完了 -->
        <div id="catCompleteStep" class="cat-takeout-step cat-complete-step" hidden>
          <p class="cat-takeout-kicker">TAKE OUT COMPLETE</p>
          <h2>見つけてくれてありがとにゃん</h2>
          <br>
          <div class="cat-complete-visual" aria-hidden="true">
            <img src="./assets/images/takeout-cat.png" alt="" class="cat-complete-cat-image">
          </div>

          <p class="cat-takeout-message">
            気が向いたら、<br>
            また見つけに来てにゃ
          </p>

          <button id="catShowCardButton" class="cat-done-button" type="button">
            テイクアウトカードを見る
          </button>
        </div>

        <!-- STEP 4 : TAKE OUT CARD -->
        <div id="catCardStep" class="cat-takeout-step cat-card-step" hidden>
          <article id="takeoutCardPreview" class="takeout-card-preview" aria-label="テイクアウトカード">
            <img class="takeout-card-base-image" src="./assets/images/takeout-card.png" alt="真夜中珈琲屋台 TAKE OUT CARD">

            <!-- カップ部分 -->
            <span id="takeoutCardCupName" class="takeout-card-overlay takeout-card-cup-name"></span>
            <span id="takeoutCardCupDrink" class="takeout-card-overlay takeout-card-cup-drink"></span>

            <!-- 下部の記入欄 -->
            <span id="takeoutCardName" class="takeout-card-overlay takeout-card-for"></span>
            <span id="takeoutCardDrink" class="takeout-card-overlay takeout-card-drink"></span>
            <span id="takeoutCardDate" class="takeout-card-overlay takeout-card-date"></span>
          </article>

          <p id="catCardStatus" class="cat-card-status" role="status" aria-live="polite"></p>

          <div class="cat-card-actions">
            <button id="catSaveCardButton" class="cat-card-button" type="button">
              画像を保存
            </button>
            <button id="catXShareButton" class="cat-card-button cat-card-button-secondary" type="button">
              Xでシェア
            </button>
            <button id="catCardCloseButton" class="cat-card-button cat-card-close-button" type="button">
              閉じる
            </button>
          </div>
        </div>
      </section>
    </div>

    <div id="openingTransition" class="opening-transition" aria-hidden="true">
      <p>今夜も、ひとり分だけ席が空いている。</p>
    </div>
  </main>

  <script src="./js/analytics.js" defer></script>
  <script src="./js/nightSkyEngine.js" defer></script>
  <script src="./js/opening.js" defer></script>
</body>

</html>
